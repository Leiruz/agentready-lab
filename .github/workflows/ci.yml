# Required merge workflow. docs/TEST_STRATEGY.md section 12 defines the seven
# ordered steps below and names Linux as the required merge platform. Hardening
# follows docs/THREAT_MODEL.md sections 21 and 22.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# No token permission by default; each job re-grants only what it needs.
# `pull_request_target` is deliberately absent: this workflow checks out and
# runs pull-request code, so it must never hold a privileged token.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  merge:
    name: Merge checks (Linux, Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out the pull-request code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The scan needs no write access, so the checkout token is not left
          # in .git/config where a later step or a build script could read it.
          persist-credentials: false

      - name: Assert the Action bundle path is committable
        # docs/MAINTAINER_CHECKLIST.md section 9 requires
        # packages/github-action/dist/index.js to be committed so that
        # `action:verify` can compare it against a clean rebuild. A bare
        # `dist/` in .gitignore silently makes that impossible, and the failure
        # mode is a bundle that is quietly never updated. Assert both
        # directions so the exception cannot be widened into "commit all
        # build output" either.
        run: |
          if git check-ignore -q packages/github-action/dist/index.js; then
            echo "::error file=.gitignore::packages/github-action/dist/index.js is git-ignored, so the committed Action bundle cannot be verified (docs/MAINTAINER_CHECKLIST.md section 9)."
            exit 1
          fi
          if ! git check-ignore -q packages/core/dist/index.js; then
            echo "::error file=.gitignore::packages/core/dist/index.js is not git-ignored; ordinary build output must stay out of the repository."
            exit 1
          fi

      - name: Set up pnpm
        # Version comes from the `packageManager` field in package.json.
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies from the committed lockfile
        # docs/THREAT_MODEL.md section 22. pnpm-workspace.yaml already blocks
        # dependency install scripts (`onlyBuiltDependencies: []`) and enforces
        # the seven-day `minimumReleaseAge` quarantine.
        run: pnpm install --frozen-lockfile

      - name: 1. Formatting check
        run: pnpm run format:check

      # Typecheck runs before lint on purpose. typescript-eslint's
      # type-aware rules read the declaration output that `tsc --build`
      # emits for the project references, so linting a clean checkout
      # first reports thousands of unresolved-type errors. Verified: on
      # a cleaned tree `eslint packages/transport-node` alone gives 280.
      - name: 2. TypeScript typecheck
        run: pnpm run typecheck

      - name: 3. Lint and package-boundary check
        # The boundary check is a test, not a lint rule (docs/TEST_STRATEGY.md
        # section 4), so it runs here as its own vitest project to fail fast on
        # a dependency-direction violation. Step 4 re-runs it as part of the
        # coverage-gated suite; the duplication is one small file.
        run: |
          pnpm run lint
          pnpm run test:boundaries

      - name: 4. Unit and contract tests
        # docs/TEST_STRATEGY.md section 2.4 requires this job to run with
        # network access disabled or with the global network APIs replaced by a
        # throwing sentinel. The sentinel is what enforces it, and it is
        # installed by vitest.config.ts rather than by this workflow:
        # packages/testkit/src/sentinel/network-sentinel.ts patches fetch and
        # net.Socket#connect, and `setupFiles` wires deny-all into the `unit`
        # project and loopback-only into the `loopback` project. The
        # `boundaries` project has no setup file; it reads manifests and
        # tsconfig files off disk and opens no socket. Blocking runner egress
        # here would not be a substitute in any case, because the Actions
        # runner needs its own outbound connection to report the job.
        run: pnpm run test

      - name: 5. Workers fixture tests
        run: pnpm run test:workers

      - name: 6. Local integration tests
        run: pnpm run test:integration

      # Both gates below exist as scripts and as vitest mirrors. CI runs the
      # seven TEST_STRATEGY steps individually and never invokes `pnpm check`,
      # so a script-only gate would be one CI never executes.
      - name: 6b. Specification registry and generated status table
        run: |
          pnpm run specs:validate
          pnpm run status:check

      - name: 7. Build and package-content inspection
        # docs/THREAT_MODEL.md section 22: "Inspect `npm pack` contents and
        # exclude fixtures, secrets, and unnecessary development files."
        # --dry-run prints the tarball contents without writing a tarball, so
        # the working tree stays clean for the next step.
        run: |
          pnpm run build
          pnpm --filter "./packages/*" exec npm pack --dry-run

      - name: No step modified a committed file
        # One line that catches lockfile drift, Prettier drift and
        # generated-artifact drift. Untracked files are deliberately not
        # checked: build output is git-ignored, and the Action bundle is not
        # committed until M2.
        run: git diff --exit-code
