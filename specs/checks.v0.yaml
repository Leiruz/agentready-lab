schema_version: "0"
registry_version: "0.1.0"
ruleset_id: "standard"
ruleset_version: "0.1.0"

snapshot:
  name: "IsItAgentReady published compatibility inventory"
  captured_at: "2026-08-28"
  compatibility_source: "https://isitagentready.com/llms-full.txt"
  published_check_count: 22
  disclaimer: >-
    This registry records a dated public compatibility contract. Cloudflare's
    detection heuristics are not normative protocol requirements, and a compat
    pass must never be reported as specification conformance.
  surface_drift:
    - >-
      The 2026-04-17 Cloudflare launch article describes an earlier inventory
      and says commerce checks do not count toward the readiness score.
    - >-
      On the snapshot date, the visible site checklist and generated Cloudflare
      URL Scanner client types appeared to lag the 22-check llms-full inventory,
      including ARD and AP2 fields.
    - >-
      Exact parity with private implementation details is neither claimed nor
      required; contract tests must name the external surface and snapshot.

modes:
  spec:
    claim: "pinned specification conformance"
    description: >-
      Evaluate independently implemented normative, recommended, and advisory
      assertions from an exact RFC, draft, version, schema, date, or commit.
  compat:
    claim: "dated external-tool compatibility observation"
    description: >-
      Reproduce only the public pass heuristic captured in this registry and
      label the result as compatibility, never as protocol conformance.
  interop:
    claim: "bounded observed interoperability"
    description: >-
      Perform an explicit safe, non-mutating runtime action and report only what
      that exact interaction demonstrated.

status_model:
  pass: "An applicable assertion was evaluated with sufficient evidence and satisfied."
  fail: "An applicable normative assertion was evaluated and violated."
  warning: "A recommendation or advisory assertion failed, or evidence indicates a non-normative risk."
  not-applicable: "The rule does not apply to the selected profile or declared target."
  unable-to-check: "The rule applies, but evidence could not be obtained or parsed safely."
  unsupported-runtime: "The runner cannot observe the required runtime surface."

