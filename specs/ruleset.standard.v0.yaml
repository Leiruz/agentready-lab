# AgentReady Lab native executable ruleset (ADR-0008 section 1).
#
# The single machine-readable authority for what this project asserts:
# per-rule implementation status, per-rule rule_version, per-assertion
# source_refs and parameter schemas, excerpt authorization, and retired
# requirements. specs/checks.v0.yaml is a frozen record of what an
# external tool published on a date and is never read at scan time.
#
# Created at ruleset_version 0.2.0 on 2026-08-29 (ADR-0008 section 5).
# Every source_refs identifier resolves against specs/sources.v0.yaml.

schema_version: "0"
ruleset_id: "standard"
ruleset_version: "0.4.0"
source_ledger_version: "0.4.0"

todo:
  - >-
    compat_assertions: no accepted decision names a single compat-mode assertion
    id. ADR-0002 section 9 fixes only the format,
    compat:<external-id>.<assertion>@<snapshot-date>. Every rule below therefore
    declares none, which leaves the compat verdicts that ADR-0009 section 6
    expects for sig-003 and sig-006 with no assertion id to report against.
  - >-
    message templates: the table ADR-0002 section 6 requires now exists as
    specs/templates.v0.yaml, keyed by assertion id and outcome kind and joined
    to this file by pnpm run specs:validate. What has not moved is the parameter
    side of the same decision: every assertion below still declares an empty
    parameter schema and authorizes no excerpt, so every template is
    parameterless except content-signals.unrecognized-vocabulary's. That is the
    fail-closed state, not an oversight: validateOutcomeParams rejects every
    parameter an assertion does not declare, and assigning one is a decision
    about what target-derived value a report may carry.
  - >-
    per-assertion source_refs: assigned for the eight M1 rules only, by reading
    each requirement against specs/sources.v0.yaml. The other fourteen rules
    still declare none and still carry the per-assertion todo, so no rule
    outside M1 can be configured. ADR-0010 decides the two M1 attributions that
    could not be made by reading a source, and records markdown.fidelity as an
    open question, but no accepted decision records the other twenty-five M1
    citations one by one. ADR-0002 section 6 requires them and forbids a rule
    choosing its own sources, which is what the ruleset supplies; a maintainer
    who wants each of those twenty-five under a decision should say so.
  - >-
    agent-skills media type, and three further server MUSTs: the pinned draft's
    HTTP Considerations section says servers MUST serve
    /.well-known/agent-skills/index.json with an application/json content type,
    and agent.discovery.skills declares no assertion that could report it.
    skills.path-schema is the path and the document shape, skills.entry is the
    entry fields and skills.digest is the interop hash of artifact bytes, so a
    Content-Type finding on any of the three would cite a requirement text that
    does not mention media types, and specs/remediation.v0.yaml and
    specs/templates.v0.yaml are keyed by that same assertion id, so the
    remediation and the rendered message would be wrong with it. Checking it
    needs a new assertion with its own source_refs, remediation entry, four
    message templates and a fixture, which is a decision and not an edit. The
    same section carries three more server MUSTs this ruleset asserts nothing
    about: the SKILL.md and archive content types, GET and HEAD support, and
    404 for a skill or file that does not exist. Until a decision adds them,
    every one of them is a requirement of the draft that a passing
    agent.discovery.skills verdict says nothing about.
  - >-
    per-assertion source_refs, section pointers: a citation carries a section
    only where a repository document already pins that section for that
    subject. rfc7763 section 2 and rfc9110 section 12.5.5 are
    docs/IMPLEMENTATION_SPEC.md section 13's worked report; rfc9727 section 4.1
    is docs/FIXTURE_CATALOG.md case api-005; rfc9309 section 2.2.4 is ADR-0009
    section 3; content-signals-draft-00 sections 3 and 4 are that entry's own
    ledger note. Every other citation names a source and no section, which
    .claude/rules/standards.md asks for and no repository document supplies.
    Closing that gap means reading the pinned documents and recording the
    reading in specs/sources.v0.yaml, not deriving a pointer from memory.

rules:
  - rule_id: "web.discovery.robots"
    rule_version: "0.1.0"
    title: "robots.txt"
    category: "discoverability"
    maturity: "stable"
    implementation_status: "supported"
    profiles: ["content", "api", "agent-service", "full"]
    runtime: ["http"]
    applicability:
      default: "applicable"
      when: "An HTTP or HTTPS origin is being evaluated for crawler discovery."
    source_refs: ["isit-2026-08-28", "rfc9309"]
    spec:
      claim_scope: "normative-conformance"
      requirements:
        - id: "robots.location"
          strength: "normative"
          text: >-
            Request the lowercase /robots.txt path at the origin root and parse
            a successful representation according to RFC 9309.
          source_refs:
            - source: "rfc9309"
          params: []
          excerpt_authorized: false
          todo:
            - "params unassigned; see the ruleset todo"
        - id: "robots.syntax"
          strength: "normative"
          text: >-
            Decode the file as UTF-8, recognize user-agent groups, and apply
            matching and precedence rules from RFC 9309.
          source_refs:
            - source: "rfc9309"
          params: []
          excerpt_authorized: false
          todo:
            - "params unassigned; see the ruleset todo"
        - id: "robots.not-authz"
          strength: "advisory"
          text: >-
            Report that REP preferences are not access authorization and must
            not protect secrets.
          source_refs:
            - source: "rfc9309"
          params: []
          excerpt_authorized: false
          todo:
            - "params unassigned; see the ruleset todo"
      deltas:
        - >-
          Spec mode implements RFC response-class and redirect semantics instead
          of treating only status 200 as meaningful.
        - >-
          Unknown extension records such as Sitemap and Content-Signal do not
          make an otherwise valid REP document invalid.
    interop:
      disposition: "safe-read-only"
      safe_actions:
        - >-
          Fetch /robots.txt with bounded redirects and body size, then expose
          the normalized groups and selected group for the configured agent
          token.
      caveats:
        - >-
          Never interpret a permissive robots policy as authorization to fetch
          another resource.

  - rule_id: "web.discovery.sitemap"
    rule_version: "0.1.0"
    title: "Sitemap"
    category: "discoverability"
    maturity: "stable"
    implementation_status: "supported"
    profiles: ["content", "api", "agent-service", "full"]
    runtime: ["http"]
    applicability:
      default: "applicable"
      when: "The target publishes crawlable resources for URL discovery."
    source_refs: ["isit-2026-08-28", "sitemaps-protocol", "rfc9309"]
    spec:
      claim_scope: "profile-conformance"
      requirements:
        - id: "sitemap.xml"
          strength: "normative"
          text: >-
            Validate the sitemap or sitemap-index root, namespace, URL scope,
            encoding, and protocol limits against the Sitemaps protocol.
          source_refs:
            - source: "sitemaps-protocol"
          params: []
          excerpt_authorized: false
          todo:
            - "params unassigned; see the ruleset todo"
        - id: "sitemap.directive"
          strength: "normative"
          text: >-
            When discovery starts from a Sitemap record in robots.txt, parse its
            absolute URL and fetch that document before claiming sitemap
            conformance.
          source_refs:
            - source: "sitemaps-protocol"
            - source: "rfc9309"
              section: "2.2.4"
          params: []
          excerpt_authorized: false
          todo:
            - "params unassigned; see the ruleset todo"
        - id: "sitemap.canonical"
          strength: "recommended"
          text: >-
            Use canonical, absolute URLs and keep last-modified data truthful
            when it is supplied.
          source_refs:
            - source: "sitemaps-protocol"
          params: []
          excerpt_authorized: false
          todo:
            - "params unassigned; see the ruleset todo"
      deltas:
        - >-
          A Sitemap directive alone is discovery evidence in compat mode but is
          insufficient for spec conformance.
        - >-
          Generic well-formed XML is insufficient; the protocol vocabulary and
          limits must also validate.
    interop:
      disposition: "safe-read-only"
      safe_actions:
        - >-
          Dereference one discovered sitemap under a bounded request and
          decompression budget and validate its declared URLs.
      caveats:
        - >-
          Do not recursively crawl sitemap indexes without an explicit depth and
          resource budget.

  - rule_id: "web.discovery.link"
    rule_version: "0.1.0"
    title: "Link headers"
    category: "discoverability"
    maturity: "mixed"
    implementation_status: "supported"
    profiles: ["content", "api", "agent-service", "full"]
    runtime: ["http"]
    applicability:
      default: "applicable"
      when: >-
        The target can advertise machine-readable resources from an HTTP
        response.
    # The self-authored policy is listed last and named for what it is. This
    # list is an inventory of what the rule rests on; it is never what a
    # finding cites. ADR-0002 section 6 copies a finding's citations from the
    # assertion declaration, so no finding can present rfc8288 and the policy
    # as one authority (ADR-0010 section 3).
    source_refs:
      - "isit-2026-08-28"
      - "rfc8288"
      - "rfc9727"
      - "agentready-lab-agent-useful-relations"
    spec:
      claim_scope: "normative-conformance"
      requirements:
        - id: "links.parse"
          strength: "normative"
          text: >-
            Parse every Link field using RFC 8288, including multiple field
            lines, commas, quoted parameters, relative targets, and anchor
            context.
          source_refs:
            - source: "rfc8288"
          params: []
          excerpt_authorized: false
          todo:
            - "params unassigned; see the ruleset todo"
        - id: "links.relation"
          strength: "normative"
          text: >-
            Interpret registered relation names and extension relation URIs
            according to RFC 8288 rather than a substring search.
          source_refs:
            - source: "rfc8288"
          params: []
          excerpt_authorized: false
          todo:
            - "params unassigned; see the ruleset todo"
        - id: "links.agent-useful"
          strength: "advisory"
          text: >-
            Classify selected discovery relations as agent-useful under a
            separately versioned AgentReady Lab policy.
          source_refs:
            - source: "agentready-lab-agent-useful-relations"
              section: "2"
          params: []
          excerpt_authorized: false
          todo:
            - "params unassigned; see the ruleset todo"
      deltas:
        - >-
          A syntactically valid Link can conform to RFC 8288 without matching
          the compatibility allowlist.
        - >-
          A recognized relation whose target is invalid can pass a presence
          heuristic but fail a relation-specific rule.
    interop:
      disposition: "safe-read-only"
      safe_actions:
        - >-
          Resolve one selected same-origin discovery link and validate the
          expected media type under a separate rule.
      caveats:
        - >-
          Cross-origin targets require the same SSRF and redirect validation as
          the original target.

  - rule_id: "dns.discovery.dns-aid"
    rule_version: "0.1.0"
    title: "DNS for AI Discovery (DNS-AID)"
    category: "discoverability"
    maturity: "draft"
    implementation_status: "planned"
    profiles: ["agent-service", "full"]
    runtime: ["dns"]
    applicability:
      default: "optional"
      when: "The user opts into draft DNS-AID evaluation for a public DNS name."
    source_refs: ["isit-2026-08-28", "dns-aid-02", "rfc9460"]
    spec:
      claim_scope: "profile-conformance"
      requirements:
        - id: "dnsaid.version"
          strength: "normative"
          text: >-
            Evaluate the owner names, service modes, parameters, and discovery
            procedure from pinned DNS-AID draft-02.
          source_refs: []
          params: []
          excerpt_authorized: false
          todo:
            - "source_refs unassigned; see the ruleset todo"
            - "params unassigned; see the ruleset todo"
        - id: "dnsaid.svcb"
          strength: "normative"
          text: >-
            Parse SVCB and HTTPS records according to RFC 9460 and reject
            AliasMode when the selected DNS-AID profile requires ServiceMode.
          source_refs: []
          params: []
          excerpt_authorized: false
          todo:
            - "source_refs unassigned; see the ruleset todo"
            - "params unassigned; see the ruleset todo"
        - id: "dnsaid.dnssec"
          strength: "normative"
          text: >-
            Require authenticated DNSSEC validation evidence rather than
            trusting an unverified AD bit from an unspecified resolver.
          source_refs: []
          params: []
          excerpt_authorized: false
          todo:
            - "source_refs unassigned; see the ruleset todo"
            - "params unassigned; see the ruleset todo"
      deltas:
        - >-
          DNS-AID is an individual Internet-Draft, not an RFC and not IETF
          consensus.
        - >-
          A future draft may change labels, parameters, or required validation;
          draft-02 results must remain pinned.
    interop:
      disposition: "safe-read-only"
      safe_actions:
        - >-
          Query configured DNSSEC-validating resolvers for the pinned owner
          names and compare normalized answers.
      caveats:
        - >-
          Resolver disagreement is evidence, not an automatic protocol failure.

  - rule_id: "web.content.markdown-negotiation"
    rule_version: "0.1.0"
    title: "Markdown negotiation"
    category: "content-accessibility"
    maturity: "convention"
    implementation_status: "supported"
    profiles: ["content", "api", "agent-service", "full"]
    runtime: ["http"]
    applicability:
      default: "applicable"
      when: "The submitted page has a meaningful Markdown representation."
    source_refs:
      - "isit-2026-08-28"
      - "cloudflare-markdown-agents"
      - "rfc7763"
      - "rfc9110"
    spec:
      claim_scope: "profile-conformance"
      requirements:
        - id: "markdown.media-type"
          strength: "normative"
          text: >-
            When this profile selects Markdown, return a valid text/markdown
            Content-Type as registered by RFC 7763.
          source_refs:
            - source: "rfc7763"
              section: "2"
          params: []
          excerpt_authorized: false
          todo:
            - "params unassigned; see the ruleset todo"
        - id: "markdown.negotiation"
          strength: "normative"
          text: >-
            Respect HTTP content negotiation without changing the resource's
            meaning or returning Markdown to an HTML-only request solely because
            a test is present.
          source_refs:
            - source: "rfc9110"
          params: []
          excerpt_authorized: false
          todo:
            - "params unassigned; see the ruleset todo"
        - id: "markdown.vary"
          strength: "recommended"
          text: >-
            Include Accept in Vary when caches could otherwise reuse one
            representation for the other.
          source_refs:
            - source: "rfc9110"
              section: "12.5.5"
          params: []
          excerpt_authorized: false
          todo:
            - "params unassigned; see the ruleset todo"
        - id: "markdown.fidelity"
          strength: "advisory"
          text: >-
            Check that critical headings, links, code, and factual text remain
            represented without invented content.
          source_refs:
            - source: "rfc9110"
          params: []
          excerpt_authorized: false
          todo:
            - "params unassigned; see the ruleset todo"
      deltas:
        - >-
          Vary: Accept and representation fidelity are valuable checks but are
          not part of IsIt's published pass heuristic.
        - >-
          Do not call a text/markdown response standards conformance without
          naming the selected profile and HTTP assertions.
    interop:
      disposition: "safe-read-only"
      safe_actions:
        - >-
          Fetch the same URL with HTML and Markdown Accept values using distinct
          cache keys, then compare media type, selected validators, and bounded
          structural facts.
      caveats:
        - >-
          Do not use an LLM as the pass/fail oracle for semantic fidelity.

  - rule_id: "web.policy.ai-crawler"
    rule_version: "0.2.0"
    title: "AI bot rules"
    category: "bot-access-control"
    maturity: "mixed"
    implementation_status: "supported"
    profiles: ["content", "api", "agent-service", "full"]
    runtime: ["http"]
    applicability:
      default: "applicable"
      when: "The target uses REP to communicate crawler policy."
    source_refs:
      - "isit-2026-08-28"
      - "rfc9309"
      - "cloudflare-ai-crawl-control"
      - "openai-crawlers"
      - "google-crawlers"
      - "anthropic-crawlers"
    spec:
      claim_scope: "detection-only"
      requirements:
        - id: "ai-rules.rep-parse"
          strength: "normative"
          text: >-
            Parse group selection and allow/disallow precedence with RFC 9309
            before reporting the effective policy for a named token.
          source_refs:
            - source: "rfc9309"
          params: []
          excerpt_authorized: false
          todo:
            - "params unassigned; see the ruleset todo"
        - id: "ai-rules.token-source"
          strength: "advisory"
          text: >-
            Version and cite the external crawler-token registry used for
            classification.
          source_refs:
            - source: "openai-crawlers"
            - source: "google-crawlers"
            - source: "anthropic-crawlers"
          params: []
          excerpt_authorized: false
          todo:
            - "params unassigned; see the ruleset todo"
        - id: "ai-rules.effective-access"
          strength: "recommended"
          text: >-
            Compute and record the effective RFC 9309 access decision for each
            configured crawler token at the configured tested path, including
            the default decision when no group matches, and report a disallowed
            decision as a warning about agent reachability rather than as a
            protocol failure.
          source_refs:
            - source: "rfc9309"
          params: []
          excerpt_authorized: false
          todo:
            - "params unassigned; see the ruleset todo"
      deltas:
        - >-
          RFC 9309 does not define an AI-crawler class or require AI-specific
          groups.
        - >-
          Spec mode reports the effective policy and cannot label mere group
          presence as access allowed.
    interop:
      disposition: "safe-read-only"
      safe_actions:
        - >-
          Calculate the effective rule for explicitly configured crawler tokens
          and paths without fetching those paths.
      caveats:
        - >-
          Do not test blocked paths merely to verify that a crawler would be
          blocked.

  - rule_id: "web.policy.content-signals"
    rule_version: "0.2.0"
    title: "Content Signals"
    category: "bot-access-control"
    maturity: "experimental"
    implementation_status: "supported"
    profiles: ["content", "api", "agent-service", "full"]
    runtime: ["http"]
    applicability:
      default: "optional"
      when: "The publisher chooses to declare Content Signals preferences."
    source_refs:
      - "isit-2026-08-28"
      - "content-signals"
      - "content-signals-draft-00"
      - "rfc9309"
    spec:
      claim_scope: "detection-only"
      requirements:
        - id: "content-signals.coverage"
          strength: "recommended"
          text: >-
            Report omitted signal dimensions rather than inferring an unstated
            yes or no policy.
          source_refs:
            - source: "content-signals-draft-00"
              section: "3"
          params: []
          excerpt_authorized: false
          todo:
            - "params unassigned; see the ruleset todo"
        - id: "content-signals.effect"
          strength: "advisory"
          text: >-
            Describe the result as a declared preference, not consent,
            prohibition, or verified recipient behavior.
          source_refs:
            - source: "content-signals-draft-00"
            - source: "content-signals"
          params: []
          excerpt_authorized: false
          todo:
            - "params unassigned; see the ruleset todo"
        - id: "content-signals.conflicting-declaration"
          strength: "advisory"
          text: >-
            When the same signal token is declared more than once with
            conflicting values inside one REP group and the pinned source
            defines no conflict resolution, report the conflict and the
            unresolved state instead of selecting a winner.
          source_refs:
            - source: "content-signals-draft-00"
            - source: "rfc9309"
              section: "2.2.4"
          params: []
          excerpt_authorized: false
          todo:
            - "params unassigned; see the ruleset todo"
        - id: "content-signals.unrecognized-vocabulary"
          strength: "advisory"
          text: >-
            When a syntactically valid Content-Signal directive declares no
            token that the dated compatibility snapshot recognizes, or declares
            an additional token beyond that set, report the declaration as
            unrecognized by the project's pinned sources and record the tokens
            verbatim as bounded sanitized evidence. This is not a violation of
            any pinned specification.
          source_refs:
            - source: "content-signals-draft-00"
              section: "4"
          params:
            - name: "recognized-token-count"
              kind: "count"
              required: true
          excerpt_authorized: false
          todo:
            - >-
              excerpt_authorized: ADR-0009 sections 4 and 5 require the declared
              tokens to be recorded verbatim as bounded sanitized evidence,
              which is ADR-0002 section 6's excerpt parameter; authorizing it
              waits for the message-template decision
      deltas:
        - >-
          The check can validate syntax and placement only; it cannot test legal
          effect or crawler compliance.
        - >-
          Absence is not a violation of RFC 9309.
    retired_requirements:
      - id: "content-signals.syntax"
        adr: "ADR-0009"
        reason: >-
          RFC 9309 section 2.2.4 defines no syntax for an extension record,
          explicitly permits leniency, and addresses its one MUST to the crawler
          rather than to the publisher. No pinned source supports a
          publisher-side syntax failure, so the assertion is retired rather than
          rewritten under another id.
    interop:
      disposition: "safe-read-only"
      safe_actions:
        - >-
          Parse and report the effective declared values for selected REP
          groups.
      caveats:
        - >-
          No network interaction can prove that an unrelated crawler observes
          the declaration.
    todo:
      - >-
        spec.deltas: the first delta copied from the snapshot says this check
        "can validate syntax and placement only", which ADR-0009 section 3
        contradicts by retiring the only syntax assertion. Replacement prose is
        not written by any accepted decision, so the copied text stands until
        one writes it.

  - rule_id: "web.identity.web-bot-auth"
    rule_version: "0.1.0"
    title: "Web Bot Auth"
    category: "bot-access-control"
    maturity: "draft"
    implementation_status: "planned"
    profiles: ["agent-service", "full"]
    runtime: ["http"]
    applicability:
      default: "informational"
      when: >-
        The target sends authenticated bot requests and publishes verification
        keys.
    source_refs:
      - "isit-2026-08-28"
      - "webbotauth-wg"
      - "webbotauth-protocol-02"
      - "rfc9421"
      - "cloudflare-webbotauth"
    spec:
      claim_scope: "profile-conformance"
      requirements:
        - id: "webbotauth.directory"
          strength: "normative"
          text: >-
            Validate the directory representation, keys, identifiers, media
            type, and cache behavior against pinned protocol draft-02.
          source_refs: []
          params: []
          excerpt_authorized: false
          todo:
            - "source_refs unassigned; see the ruleset todo"
            - "params unassigned; see the ruleset todo"
        - id: "webbotauth.httpsig"
          strength: "normative"
          text: >-
            When signature verification is selected, implement RFC 9421
            covered-component, algorithm, time, and key-selection rules required
            by the pinned profile.
          source_refs: []
          params: []
          excerpt_authorized: false
          todo:
            - "source_refs unassigned; see the ruleset todo"
            - "params unassigned; see the ruleset todo"
      deltas:
        - >-
          Directory presence is a discovery detector, not end-to-end Web Bot
          Auth conformance.
        - >-
          Draft-specific results must retain the draft number when a later IETF
          document changes.
    interop:
      disposition: "not-in-mvp"
      safe_actions:
        - >-
          A future controlled harness may verify a fixture-signed request
          against a fixture key directory.
      caveats:
        - >-
          Do not issue signed requests as a third-party identity or treat
          arbitrary live signatures as authorization.

  - rule_id: "agent.discovery.mcp-server-card"
    rule_version: "0.1.0"
    title: "MCP Server Card"
    category: "discovery"
    maturity: "experimental"
    implementation_status: "planned"
    profiles: ["agent-service", "full"]
    runtime: ["http"]
    applicability:
      default: "optional"
      when: >-
        The target intentionally advertises an MCP server using the evolving
        Server Card proposal.
    source_refs: ["isit-2026-08-28", "mcp-sep-2127"]
    spec:
      claim_scope: "profile-conformance"
      requirements:
        - id: "mcp-card.pin"
          strength: "normative"
          text: >-
            Pin an exact SEP-2127 commit and validate only the discovery path,
            card schema, and media behavior defined by that snapshot.
          source_refs: []
          params: []
          excerpt_authorized: false
          todo:
            - "source_refs unassigned; see the ruleset todo"
            - "params unassigned; see the ruleset todo"
        - id: "mcp-card.fields"
          strength: "normative"
          text: >-
            Validate all fields required by the pinned card schema, not only a
            name field.
          source_refs: []
          params: []
          excerpt_authorized: false
          todo:
