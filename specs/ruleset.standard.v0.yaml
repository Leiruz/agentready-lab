          excerpt_authorized: false
          todo:
            - "source_refs unassigned; see the ruleset todo"
            - "params unassigned; see the ruleset todo"
        - id: "x402.payment-required"
          strength: "normative"
          text: >-
            At a declared payable endpoint, validate the HTTP 402 response and
            the complete v2 PAYMENT-REQUIRED challenge object, encoding, and
            required fields.
          source_refs: []
          params: []
          excerpt_authorized: false
          todo:
            - "source_refs unassigned; see the ruleset todo"
            - "params unassigned; see the ruleset todo"
        - id: "x402.no-payment"
          strength: "advisory"
