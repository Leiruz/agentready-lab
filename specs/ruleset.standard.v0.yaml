  - rule_id: "commerce.payment.ap2"
    rule_version: "0.1.0"
    title: "Agent Payments Protocol"
    category: "commerce"
    maturity: "experimental"
    implementation_status: "planned"
    profiles: ["commerce", "full"]
    runtime: ["http"]
    applicability:
      default: "commerce-endpoint-required"
      when: >-
        The target explicitly opts into AP2 compatibility or a pinned AP2
        version.
    source_refs: ["isit-2026-08-28", "ap2-v0.2", "ap2-repository", "a2a-v1.0"]
    spec:
      claim_scope: "no-current-conformance-claim"
      requirements:
        - id: "ap2.compat-legacy"
          strength: "advisory"
          text: >-
            Keep the A2A extension detector only in the 2026-08-28 compatibility
            profile and label it legacy v0.1 behavior.
          source_refs: []
          params: []
          excerpt_authorized: false
          todo:
            - "source_refs unassigned; see the ruleset todo"
            - "params unassigned; see the ruleset todo"
        - id: "ap2.v0.2"
          strength: "normative"
          text: >-
            A future spec rule must implement AP2 v0.2 mandates, roles, schemas,
            and security semantics from a pinned release rather than requiring
            the removed Agent Card extension.
          source_refs: []
          params: []
          excerpt_authorized: false
          todo:
            - "source_refs unassigned; see the ruleset todo"
            - "params unassigned; see the ruleset todo"
      deltas:
        - >-
          AP2 v0.2 dropped the legacy A2A Agent Card extension used by the
          published IsIt heuristic.
        - >-
          A current AP2 v0.2 implementation may correctly omit that extension
          and fail compat mode.
        - >-
          No AP2 v0.2 conformance claim belongs in the MVP until its mandate
          validation and security model have dedicated fixtures and review.
    interop:
      disposition: "not-in-mvp"
      safe_actions:
        - >-
          Future work may validate fixture mandates and signatures entirely
          offline.
      caveats:
        - >-
          Never create, sign, replay, or submit a live mandate or payment
          authorization.
