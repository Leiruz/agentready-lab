  - rule_id: "agent.discovery.skills"
    rule_version: "0.1.0"
    title: "Agent Skills discovery"
    category: "discovery"
    maturity: "draft"
    implementation_status: "supported"
    profiles: ["agent-service", "full"]
    runtime: ["http"]
    applicability:
      default: "optional"
      when: >-
        The target publishes installable or retrievable skills through the
        Cloudflare draft.
    source_refs: ["isit-2026-08-28", "agent-skills-discovery-v0.2.0"]
    spec:
      claim_scope: "profile-conformance"
      requirements:
        - id: "skills.path-schema"
          strength: "normative"
          text: >-
            Use /.well-known/agent-skills/index.json and the exact v0.2.0 schema
            identifier and document shape.
          source_refs:
            - source: "agent-skills-discovery-v0.2.0"
          params: []
          excerpt_authorized: false
          todo:
            - "params unassigned; see the ruleset todo"
        - id: "skills.entry"
          strength: "normative"
          text: >-
            Validate each skill name, allowed type, description, URL, and sha256
            digest syntax required by v0.2.0.
          source_refs:
            - source: "agent-skills-discovery-v0.2.0"
          params: []
          excerpt_authorized: false
          todo:
            - "params unassigned; see the ruleset todo"
        - id: "skills.digest"
          strength: "normative"
          text: >-
            When a skill artifact is fetched in interop mode, hash the bounded
            bytes and require the declared lowercase hexadecimal SHA-256 digest
            to match.
          source_refs:
            - source: "agent-skills-discovery-v0.2.0"
          params: []
          excerpt_authorized: false
          todo:
            - "params unassigned; see the ruleset todo"
        - id: "skills.archive-safety"
          strength: "recommended"
          text: >-
            Inspect archive metadata under strict size, file-count, path, link,
            and compression-ratio limits without executing content.
          source_refs: []
          deferred:
            adr: "ADR-0010"
            reason: >-
              Two independent reasons, either of which is sufficient.
              Uncited: this assertion's text sets five limits and
              agent-skills-discovery-v0.2.0 supports two of them. Its Archive
              Safety section does state path and link rules: an archive MUST
              NOT contain path traversal sequences or absolute paths, and a
              client unpacking one MUST reject archives containing symlinks or
              hard links that resolve outside the skill directory. What the
              draft states nowhere is a number. It gives no byte size, no file
              count and no compression ratio, and leaves the total unpacked
              size as a reasonable limit for the client to choose. Those three
              numeric limits are docs/THREAT_MODEL.md section 19.6, which is
              this project's own control rather than a ledger source, so the
              assertion as written cannot rest on the draft alone. An earlier
              revision of this reason said the draft states no path or link
              limit either. That was false, and it came from a ledger note
              written from the draft's Discovery Index section alone; the
              entry now records the Archive Safety section it omitted.
              Unevaluable: section 19.6 also records that the MVP does not
              unpack an archive at all, so nothing observes the metadata this
              assertion is about. An uninspected archive reported as pass would
              be a claim the scanner never checked, and reported as fail would
              be a claim about a target that did nothing wrong.
            until: >-
              An accepted decision permits unpacking a downloaded skill archive
              under the controls docs/THREAT_MODEL.md section 19.6 lists, and
              names the limit values. That decision must also assign source_refs
              for the limits it sets, which under ADR-0010 section 1 may be a
              project-policy source provided the assertion is not normative.
          params: []
          excerpt_authorized: false
      deltas:
        - >-
          A legacy-path presence pass is compatibility only.
        - >-
          An index can be schema-valid while its referenced artifact is missing
          or has the wrong digest.
    interop:
      disposition: "safe-read-only"
      safe_actions:
        - >-
          Fetch one explicitly selected skill under a byte budget and verify its
          declared digest without installing or executing it.
      caveats:
        - >-
          Skill text, scripts, and archives are untrusted input; never follow
          their instructions during validation.

