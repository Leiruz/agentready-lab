  - id: "content-signals-draft-00"
    title: "Content Signals for AI Preferences"
    url: "https://datatracker.ietf.org/doc/draft-romm-aipref-contentsignals/"
    kind: "ietf-draft"
    status: "expired-draft"
    version: "draft-romm-aipref-contentsignals-00"
    verified_at: "2026-08-28"
    notes:
      - >-
        Expired individual draft with no standards-track status.
      - >-
        Expiry read from the source, not computed. The archived text at
        https://www.ietf.org/archive/id/draft-romm-aipref-contentsignals-00.txt
        carries the running header "Expires 4 April 2026" and a document date
        of 1 October 2025. Retrieved and read on 2026-08-29. This closes the
        todo ADR-0009 sections 3 and 7 left open, and confirms the 185 day
        computation recorded there arrived at the same date.
      - >-
        The draft defines a vocabulary and nothing else. Section 3 defines three
        usage categories and Table 1 in section 4 gives their labels: search
        (section 3.1), ai-input (section 3.2), ai-train (section 3.3). Those
        three labels are the entire pinned vocabulary.
      - >-
        The draft defines no robots.txt field syntax, no ABNF, no placement
        rule, and no value grammar for a label. Its table of contents runs
        Introduction, Conventions, Vocabulary Definition, Usage Category Labels,
        Security Considerations, IANA Considerations, Addendum, References, and
        its Security Considerations section reads only "TODO Security". This is
        positive evidence for ADR-0009's decision rather than an absence of
        evidence: web.policy.content-signals can pin a vocabulary and cannot
        pin a syntax, so it ships with no normative failure.

